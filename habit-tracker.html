<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    viewport meta tag makes the page scale correctly on mobile devices.
    Without it, phones would zoom out to show the "desktop" version.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker</title>

  <style>
    /* ============================================================
       CSS CUSTOM PROPERTIES (variables)
       Define colors and sizes once here so they're easy to change.
    ============================================================ */
    :root {
      --bg:          #0f0f13;
      --surface:     #1c1c24;
      --surface2:    #26262f;
      --border:      #32323e;
      --accent:      #7c6af7;
      --accent-dim:  #3d3780;
      --green:       #3dd68c;
      --green-dim:   #1a4a35;
      --red:         #f76a6a;
      --text:        #e8e8f0;
      --text-muted:  #7a7a8c;
      --radius:      12px;
      --radius-sm:   8px;
    }

    /* ============================================================
       RESET & BASE
       Remove browser defaults so everything looks consistent.
    ============================================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 80px;
    }

    /* ============================================================
       LAYOUT
       A centered column that works on both mobile and desktop.
    ============================================================ */
    .container {
      max-width: 560px;
      margin: 0 auto;
    }

    /* ============================================================
       HEADER
    ============================================================ */
    header {
      margin-bottom: 32px;
      text-align: center;
    }

    header h1 {
      font-size: clamp(1.6rem, 5vw, 2.2rem); /* scales with screen width */
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 6px;
    }

    /* The date pill shown under the title */
    .date-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* ============================================================
       ADD HABIT FORM
    ============================================================ */
    .add-form {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }

    .add-form input {
      flex: 1; /* take up all available space */
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-form input::placeholder {
      color: var(--text-muted);
    }

    .add-form input:focus {
      border-color: var(--accent);
    }

    .btn-add {
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.2s;
    }

    .btn-add:hover {
      opacity: 0.85;
    }

    /* ============================================================
       SECTION LABEL (e.g. "Today's Habits")
    ============================================================ */
    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* ============================================================
       EMPTY STATE
       Shown when there are no habits yet.
    ============================================================ */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
    }

    .empty-state .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    /* ============================================================
       HABIT CARD
       Each habit is a card with a checkbox, info, and delete button.
    ============================================================ */
    .habits-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .habit-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color 0.2s, background 0.2s;
    }

    /* When a habit is checked today, highlight the card */
    .habit-card.done {
      border-color: var(--green-dim);
      background: #161f1b;
    }

    /* ---- Checkbox ---- */
    .habit-check {
      width: 28px;
      height: 28px;
      min-width: 28px; /* prevent shrinking */
      border-radius: 50%;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }

    .habit-check:hover {
      border-color: var(--green);
    }

    .habit-card.done .habit-check {
      background: var(--green);
      border-color: var(--green);
    }

    /* Checkmark SVG inside the circle */
    .habit-check svg {
      display: none;
      width: 14px;
      height: 14px;
      stroke: #fff;
      stroke-width: 2.5;
      fill: none;
    }

    .habit-card.done .habit-check svg {
      display: block;
    }

    /* ---- Text area ---- */
    .habit-info {
      flex: 1;
      min-width: 0; /* allow text to truncate */
    }

    .habit-name {
      font-size: 0.97rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .habit-card.done .habit-name {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    /* ---- Streak badge ---- */
    .streak-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Flame shows when streak > 0 */
    .streak-badge .flame {
      font-style: normal;
    }

    .streak-badge.active {
      color: #f5a623;
    }

    /* ---- Delete button ---- */
    .btn-delete {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.2s, background 0.2s;
    }

    .btn-delete:hover {
      color: var(--red);
      background: rgba(247, 106, 106, 0.1);
    }

    /* ============================================================
       PROGRESS BAR
       Shows how many habits are done today.
    ============================================================ */
    .progress-wrap {
      margin-bottom: 20px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .progress-track {
      height: 6px;
      background: var(--surface2);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    /* ============================================================
       TOAST NOTIFICATION
       A small message that pops up briefly.
    ============================================================ */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.88rem;
      white-space: nowrap;
      transition: transform 0.3s ease;
      z-index: 999;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* ============================================================
       RESPONSIVE TWEAKS
       Extra adjustments for smaller screens.
    ============================================================ */
    @media (max-width: 400px) {
      .habit-name {
        font-size: 0.9rem;
      }
    }

    /* ============================================================
       COMPLETION ANIMATION
       checkPop: the green circle bounces when a habit is checked.
       particleFly: each burst particle flies outward and fades.
       --tx and --ty are set per-particle in JavaScript.
    ============================================================ */
    @keyframes checkPop {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.38); }
      70%  { transform: scale(0.92); }
      100% { transform: scale(1); }
    }

    @keyframes particleFly {
      0%   { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    /* Added to the checkbox button right after render() rebuilds it */
    .pop-anim {
      animation: checkPop 0.35s ease forwards;
    }

    /* Each individual burst particle — positioned by JS */
    .particle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      animation: particleFly 0.6s ease-out forwards;
      z-index: 9999;
    }

    /* ============================================================
       INLINE NAME EDITING
       The habit name becomes clickable; clicking swaps it for an
       unstyled input so the user can edit in-place.
    ============================================================ */
    .habit-name {
      cursor: text;
      transition: color 0.15s;
    }

    .habit-name:hover {
      color: var(--accent);
    }

    /* The input that replaces the name text when editing */
    .name-edit-input {
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--accent);
      color: var(--text);
      font-size: 0.97rem;
      font-weight: 500;
      font-family: inherit;
      width: 100%;
      outline: none;
      padding: 0 0 2px;
      /* Reset the parent div's overflow/truncation styles so the input isn't clipped */
      text-decoration: none;
      white-space: normal;
    }

    /* While an input is inside the name div, lift the overflow clipping */
    .habit-name:has(.name-edit-input) {
      overflow: visible;
      white-space: normal;
    }

    /* ============================================================
       CALENDAR SECTION
    ============================================================ */
    .calendar-section {
      margin-top: 40px;
    }

    /* Navigation row: [< arrow]  [Month Year]  [> arrow] */
    .calendar-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .calendar-title {
      font-size: 1rem;
      font-weight: 700;
    }

    /* Prev / Next arrow buttons */
    .btn-nav {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .btn-nav:hover:not(:disabled) {
      background: var(--border);
    }

    .btn-nav:disabled {
      opacity: 0.3;
      cursor: default;
    }

    /* 7-column grid for the calendar */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    /* Day-of-week header (Mon, Tue, …) */
    .cal-dow {
      text-align: center;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 4px 0 8px;
    }

    /* Individual day cell — square via aspect-ratio */
    .cal-day {
      aspect-ratio: 1;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
      user-select: none;
    }

    /* Padding cells that fill the gap before the 1st of the month */
    .cal-day.empty {
      background: transparent;
      border-color: transparent;
    }

    /* Days that haven't happened yet */
    .cal-day.future {
      opacity: 0.35;
    }

    /* Today gets an accent border */
    .cal-day.today {
      border-color: var(--accent) !important;
      border-width: 2px;
      box-shadow: 0 0 0 1px var(--accent-dim);
    }

    /* Days where habits existed but no data was recorded yet (before habits were added) */
    .cal-day.no-data {
      background: var(--surface);
    }

    .cal-day-num {
      font-size: 0.78rem;
      font-weight: 600;
      line-height: 1;
    }

    .cal-day-pct {
      font-size: 0.6rem;
      line-height: 1;
      margin-top: 3px;
      opacity: 0.85;
    }

    /* Legend row below the calendar */
    .cal-legend {
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- ======================================================
         HEADER
    ====================================================== -->
    <header>
      <h1>Habit Tracker</h1>
      <p>Build streaks. Stay consistent.</p>
      <!-- JavaScript will fill in today's date here -->
      <span class="date-badge" id="date-display"></span>
    </header>

    <!-- ======================================================
         ADD HABIT FORM
    ====================================================== -->
    <div class="add-form">
      <input
        type="text"
        id="habit-input"
        placeholder="Add a new habit..."
        maxlength="60"
        autocomplete="off"
      />
      <button class="btn-add" onclick="addHabit()">Add</button>
    </div>

    <!-- ======================================================
         PROGRESS BAR
         Hidden initially; shown when at least 1 habit exists.
    ====================================================== -->
    <div class="progress-wrap" id="progress-wrap" style="display:none">
      <div class="progress-header">
        <span>Today's progress</span>
        <span id="progress-label">0 / 0</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
    </div>

    <!-- ======================================================
         HABITS LIST
    ====================================================== -->
    <p class="section-label">Your habits</p>
    <div class="habits-list" id="habits-list">
      <!-- Cards are inserted here by JavaScript -->
    </div>

    <!-- ======================================================
         EMPTY STATE
         Shown when the habits list is empty.
    ====================================================== -->
    <div class="empty-state" id="empty-state" style="display:none">
      <div class="empty-icon">+</div>
      <p>No habits yet.<br/>Add one above to get started!</p>
    </div>

    <!-- ======================================================
         CALENDAR
         Shows each day of the current (or past) month as a
         colored cell: green = high completion, red = low.
    ====================================================== -->
    <div class="calendar-section">
      <p class="section-label">Monthly Overview</p>

      <!-- Navigation: previous month / title / next month -->
      <div class="calendar-nav">
        <button class="btn-nav" id="cal-prev" onclick="prevMonth()" title="Previous month">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <span class="calendar-title" id="cal-title"></span>

        <button class="btn-nav" id="cal-next" onclick="nextMonth()" title="Next month">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>

      <!-- The 7-column grid — filled by JavaScript -->
      <div class="cal-grid" id="cal-grid"></div>

      <!-- Color legend -->
      <div class="cal-legend">
        <span class="legend-item">
          <span class="legend-dot" style="background:hsl(0,60%,18%);border-color:hsl(0,60%,28%)"></span>0%
        </span>
        <span class="legend-item">
          <span class="legend-dot" style="background:hsl(35,60%,18%);border-color:hsl(35,60%,28%)"></span>25%
        </span>
        <span class="legend-item">
          <span class="legend-dot" style="background:hsl(70,60%,18%);border-color:hsl(70,60%,28%)"></span>50%
        </span>
        <span class="legend-item">
          <span class="legend-dot" style="background:hsl(105,60%,18%);border-color:hsl(105,60%,28%)"></span>75%
        </span>
        <span class="legend-item">
          <span class="legend-dot" style="background:hsl(140,60%,18%);border-color:hsl(140,60%,28%)"></span>100%
        </span>
        <span class="legend-item">
          <span class="legend-dot"></span>No data
        </span>
      </div>
    </div>

  </div>

  <!-- Toast notification (lives outside the scrollable column) -->
  <div class="toast" id="toast"></div>

  <script>
    // =============================================================
    // DATA MODEL
    //
    // We store everything in localStorage under the key "habits".
    // localStorage is a built-in browser feature that saves data
    // permanently (until you clear browser data).
    //
    // Each habit looks like this:
    // {
    //   id:          "abc123",      // unique ID
    //   name:        "Drink water", // display name
    //   createdAt:   "2025-06-01",  // date string (YYYY-MM-DD)
    //   completions: ["2025-06-01", "2025-06-02"]  // list of done dates
    // }
    // =============================================================

    const STORAGE_KEY = "habit-tracker-v1";

    // =============================================================
    // CALENDAR STATE
    // These two variables track which month the calendar is showing.
    // We start on the current month and let the user go backwards.
    // =============================================================
    let calYear  = new Date().getFullYear();
    let calMonth = new Date().getMonth(); // 0 = January, 11 = December

    // Load habits from localStorage, or start with an empty array.
    function loadHabits() {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }

    // Save the current habits array back to localStorage.
    function saveHabits(habits) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(habits));
    }

    // =============================================================
    // DATE HELPERS
    // =============================================================

    // Returns today's date as "YYYY-MM-DD" (e.g. "2025-06-01").
    // We use this string as a key for completions.
    function todayStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0"); // months are 0-indexed
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    // Returns yesterday's date string.
    function yesterdayStr() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    // =============================================================
    // STREAK CALCULATION
    //
    // A streak is how many consecutive days (ending today or yesterday)
    // the habit was completed.
    //
    // Example: completions = ["2025-05-30", "2025-05-31", "2025-06-01"]
    // If today is 2025-06-01 → streak = 3
    // If today is 2025-06-02 and yesterday was completed → streak = 3
    // =============================================================
    function calcStreak(completions) {
      if (!completions || completions.length === 0) return 0;

      // Sort dates newest-first
      const sorted = [...completions].sort().reverse();
      const today = todayStr();
      const yesterday = yesterdayStr();

      // Streak only continues if completed today or yesterday
      if (sorted[0] !== today && sorted[0] !== yesterday) return 0;

      let streak = 1;
      // Walk backwards through the sorted dates
      for (let i = 1; i < sorted.length; i++) {
        // Check if this date is exactly one day before the previous one
        const prev = new Date(sorted[i - 1]);
        const curr = new Date(sorted[i]);
        const diffDays = Math.round((prev - curr) / (1000 * 60 * 60 * 24));
        if (diffDays === 1) {
          streak++;
        } else {
          break; // gap found, stop counting
        }
      }
      return streak;
    }

    // =============================================================
    // ADD A HABIT
    // =============================================================
    function addHabit() {
      const input = document.getElementById("habit-input");
      const name = input.value.trim();

      if (!name) {
        showToast("Please enter a habit name.");
        input.focus();
        return;
      }

      const habits = loadHabits();

      // Check for duplicates (case-insensitive)
      const duplicate = habits.some(h => h.name.toLowerCase() === name.toLowerCase());
      if (duplicate) {
        showToast("You already have that habit!");
        return;
      }

      // Build the new habit object
      const newHabit = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        name: name,
        createdAt: todayStr(),
        completions: []
      };

      habits.push(newHabit);
      saveHabits(habits);

      input.value = "";
      input.focus();
      render();
      showToast("Habit added!");
    }

    // =============================================================
    // DELETE A HABIT
    // =============================================================
    function deleteHabit(id) {
      let habits = loadHabits();
      habits = habits.filter(h => h.id !== id);
      saveHabits(habits);
      render();
      showToast("Habit removed.");
    }

    // =============================================================
    // TOGGLE COMPLETION FOR TODAY
    //
    // buttonEl is the checkbox <button> that was clicked. We read
    // its screen position before render() destroys it so we can
    // spawn the particle burst at exactly the right place.
    // =============================================================
    function toggleHabit(id, buttonEl) {
      const habits = loadHabits();
      const habit = habits.find(h => h.id === id);
      if (!habit) return;

      const today = todayStr();
      const idx = habit.completions.indexOf(today);
      const markingDone = idx === -1;

      if (markingDone) {
        // Capture position NOW — render() is about to wipe this element
        const rect = buttonEl ? buttonEl.getBoundingClientRect() : null;

        habit.completions.push(today);
        saveHabits(habits);
        render();

        // Trigger burst particles at the old button position
        if (rect) spawnBurst(rect);

        // Add bounce animation to the freshly-built checkbox
        const newBtn = document.querySelector(`.habit-card[data-id="${id}"] .habit-check`);
        if (newBtn) {
          newBtn.classList.add("pop-anim");
          newBtn.addEventListener("animationend", () => newBtn.classList.remove("pop-anim"), { once: true });
        }
      } else {
        // Already done — unmark (no animation)
        habit.completions.splice(idx, 1);
        saveHabits(habits);
        render();
      }
    }

    // =============================================================
    // PARTICLE BURST
    //
    // Creates 12 small colored circles that fly outward from the
    // center of `rect` (a DOMRect), then removes them automatically.
    // =============================================================
    function spawnBurst(rect) {
      const cx = rect.left + rect.width  / 2;
      const cy = rect.top  + rect.height / 2;

      // Palette: mix of green, accent purple, and gold
      const colors = ["#3dd68c", "#7c6af7", "#f5a623", "#3dd68c", "#a78bf9", "#3dd68c"];

      for (let i = 0; i < 12; i++) {
        const p = document.createElement("div");
        p.className = "particle";

        // Random size between 5 and 9 px
        const size = 5 + Math.random() * 4;
        p.style.width  = size + "px";
        p.style.height = size + "px";
        p.style.background = colors[i % colors.length];

        // Center the particle on the checkbox
        p.style.left = (cx - size / 2) + "px";
        p.style.top  = (cy - size / 2) + "px";

        // Random direction: angle spread across full 360°, distance 30–60 px
        const angle    = (i / 12) * 2 * Math.PI + (Math.random() - 0.5) * 0.8;
        const distance = 30 + Math.random() * 30;
        p.style.setProperty("--tx", Math.cos(angle) * distance + "px");
        p.style.setProperty("--ty", Math.sin(angle) * distance + "px");

        document.body.appendChild(p);

        // Clean up after the animation finishes (650 ms matches the CSS duration)
        setTimeout(() => p.remove(), 650);
      }
    }

    // =============================================================
    // RENDER — DRAW THE UI
    //
    // Instead of updating individual pieces, we redraw the whole
    // list each time. This is simple and works well for small lists.
    // =============================================================
    function render() {
      const habits = loadHabits();
      const today = todayStr();
      const list = document.getElementById("habits-list");
      const empty = document.getElementById("empty-state");
      const progressWrap = document.getElementById("progress-wrap");
      const progressFill = document.getElementById("progress-fill");
      const progressLabel = document.getElementById("progress-label");

      // Clear the current list
      list.innerHTML = "";

      if (habits.length === 0) {
        empty.style.display = "block";
        progressWrap.style.display = "none";
        return;
      }

      empty.style.display = "none";
      progressWrap.style.display = "block";

      // Count how many are done today for the progress bar
      const doneCount = habits.filter(h => h.completions.includes(today)).length;
      const pct = Math.round((doneCount / habits.length) * 100);
      progressFill.style.width = pct + "%";
      progressLabel.textContent = `${doneCount} / ${habits.length}`;

      // Build a card for each habit
      habits.forEach(habit => {
        const isDone = habit.completions.includes(today);
        const streak = calcStreak(habit.completions);

        // Create the card element
        // data-id lets us find this specific card after render() rebuilds the DOM
        const card = document.createElement("div");
        card.className = "habit-card" + (isDone ? " done" : "");
        card.dataset.id = habit.id;

        // Streak display: show flame icon if streak > 0
        const streakHTML = streak > 0
          ? `<span class="streak-badge active"><em class="flame">&#128293;</em> ${streak} day streak</span>`
          : `<span class="streak-badge">No streak yet</span>`;

        card.innerHTML = `
          <!-- Circular checkbox — passes itself (this) so the animation can read its position -->
          <button class="habit-check" onclick="toggleHabit('${habit.id}', this)" title="${isDone ? "Unmark" : "Mark as done"}">
            <!-- Checkmark SVG (only visible when done) -->
            <svg viewBox="0 0 16 16">
              <polyline points="2,8 6,12 14,4" />
            </svg>
          </button>

          <!-- Name and streak: clicking the name starts inline editing -->
          <div class="habit-info">
            <div class="habit-name" onclick="startEditing('${habit.id}')" title="Click to rename">${escapeHTML(habit.name)}</div>
            ${streakHTML}
          </div>

          <!-- Delete button -->
          <button class="btn-delete" onclick="deleteHabit('${habit.id}')" title="Delete habit">
            <!-- Trash icon SVG -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6l-1 14H6L5 6"></path>
              <path d="M10 11v6M14 11v6"></path>
              <path d="M9 6V4h6v2"></path>
            </svg>
          </button>
        `;

        list.appendChild(card);
      });

      // Redraw the calendar so it reflects any changes (e.g. toggling a habit)
      renderCalendar();
    }

    // =============================================================
    // CALENDAR — MONTH NAVIGATION
    // =============================================================

    // Go one month back (no lower limit — you can scroll as far back as you want)
    function prevMonth() {
      calMonth--;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      renderCalendar();
    }

    // Go one month forward, but stop at the current month
    function nextMonth() {
      const now = new Date();
      if (calYear === now.getFullYear() && calMonth === now.getMonth()) return;
      calMonth++;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendar();
    }

    // =============================================================
    // CALENDAR — RENDER
    //
    // Builds the full month grid. For each day it:
    //   1. Finds habits that existed on that day (createdAt <= date)
    //   2. Counts how many were completed
    //   3. Picks a background color: red (0%) → green (100%)
    // =============================================================
    function renderCalendar() {
      const habits  = loadHabits();
      const today   = todayStr();
      const now     = new Date();
      const isCurrentMonth = (calYear === now.getFullYear() && calMonth === now.getMonth());

      // --- Update title and disable "next" when already on current month ---
      document.getElementById("cal-title").textContent =
        new Date(calYear, calMonth, 1).toLocaleDateString(undefined, {
          month: "long", year: "numeric"
        });
      document.getElementById("cal-next").disabled = isCurrentMonth;

      const grid = document.getElementById("cal-grid");
      grid.innerHTML = "";

      // --- Day-of-week headers (Monday first) ---
      ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(label => {
        const th = document.createElement("div");
        th.className = "cal-dow";
        th.textContent = label;
        grid.appendChild(th);
      });

      // --- Work out how many blank cells to insert before the 1st ---
      // getDay() returns 0=Sun, 1=Mon, ..., 6=Sat
      // We want Monday=0, so we shift: (Sun → 6, Mon → 0, Tue → 1, ...)
      const firstDow = new Date(calYear, calMonth, 1).getDay();
      const offset   = (firstDow + 6) % 7;

      for (let i = 0; i < offset; i++) {
        const blank = document.createElement("div");
        blank.className = "cal-day empty";
        grid.appendChild(blank);
      }

      // --- Day cells ---
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate(); // day 0 of next month = last day of this month

      for (let d = 1; d <= daysInMonth; d++) {
        const mm      = String(calMonth + 1).padStart(2, "0");
        const dd      = String(d).padStart(2, "0");
        const dateStr = `${calYear}-${mm}-${dd}`;

        const isFuture = dateStr > today;
        const isToday  = dateStr === today;

        // Habits that had already been created on this specific day
        const active = habits.filter(h => h.createdAt <= dateStr);

        // Percentage of those habits completed (null = no habits existed yet)
        let pct = null;
        let doneCount = 0;
        if (active.length > 0 && !isFuture) {
          doneCount = active.filter(h => h.completions.includes(dateStr)).length;
          pct = Math.round(doneCount / active.length * 100);
        }

        // --- Build the cell ---
        const cell = document.createElement("div");

        let cls = "cal-day";
        if (isFuture)              cls += " future";
        if (isToday)               cls += " today";
        if (pct === null && !isFuture) cls += " no-data";
        cell.className = cls;

        // Color: interpolate hue from 0° (red) to 140° (green)
        // Only applied to past/today days with actual data
        if (!isFuture && pct !== null) {
          const hue = Math.round(pct * 1.4); // 0 → 0, 100 → 140
          cell.style.background   = `hsl(${hue}, 60%, 18%)`;
          cell.style.borderColor  = `hsl(${hue}, 60%, 28%)`;
          cell.style.color        = `hsl(${hue}, 80%, 80%)`;
        }

        // Tooltip on hover: shows full detail (e.g. "3/5 habits — 60%")
        if (!isFuture && pct !== null) {
          cell.title = `${dateStr}  •  ${doneCount} / ${active.length} habits  (${pct}%)`;
        } else if (!isFuture && active.length === 0) {
          cell.title = `${dateStr}  •  No habits tracked yet`;
        } else if (isFuture) {
          cell.title = dateStr;
        }

        // Inner content: day number + percentage (if data exists)
        cell.innerHTML =
          `<span class="cal-day-num">${d}</span>` +
          (!isFuture && pct !== null ? `<span class="cal-day-pct">${pct}%</span>` : "");

        grid.appendChild(cell);
      }
    }

    // =============================================================
    // INLINE NAME EDITING
    // =============================================================

    // Called when the user clicks a habit name.
    // Swaps the name <div> for a styled <input> in-place.
    function startEditing(id) {
      // If any habit is already being edited, commit it first then bail out.
      // render() will rebuild the DOM; the user can click the new habit again.
      const existingInput = document.querySelector(".name-edit-input");
      if (existingInput) {
        const existingCard = existingInput.closest("[data-id]");
        const existingId = existingCard ? existingCard.dataset.id : null;
        if (existingId === id) return; // already editing this same habit — ignore
        commitEdit(existingId, existingInput.value);
        return;
      }

      const nameEl = document.querySelector(`.habit-card[data-id="${id}"] .habit-name`);
      if (!nameEl) return;

      // Read the current name from the displayed text
      const currentName = nameEl.textContent;

      // Build the input
      const input = document.createElement("input");
      input.type = "text";
      input.className = "name-edit-input";
      input.value = currentName;
      input.maxLength = 60;

      // Replace the div content with the input
      nameEl.textContent = "";
      nameEl.appendChild(input);
      input.focus();
      input.select();

      // Flag to prevent blur from committing after Escape cancels
      let cancelled = false;

      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          e.preventDefault();
          commitEdit(id, input.value);
        } else if (e.key === "Escape") {
          cancelled = true;
          render(); // discard changes, restore original name
        }
      });

      // blur fires when the user clicks away — save then.
      // The 120 ms delay lets the Escape keydown handler run first,
      // so pressing Escape doesn't accidentally also trigger a save.
      input.addEventListener("blur", function () {
        setTimeout(() => {
          if (!cancelled) commitEdit(id, input.value);
        }, 120);
      });
    }

    // Validates and saves the new name, then re-renders.
    function commitEdit(id, rawName) {
      const newName = rawName.trim();

      if (!newName) {
        showToast("Name can't be empty.");
        // Re-focus the input if it still exists
        const input = document.querySelector(`.habit-card[data-id="${id}"] .name-edit-input`);
        if (input) input.focus();
        return;
      }

      const habits = loadHabits();

      // Reject if another habit already has this name (case-insensitive)
      const duplicate = habits.some(h => h.id !== id && h.name.toLowerCase() === newName.toLowerCase());
      if (duplicate) {
        showToast("You already have that habit!");
        const input = document.querySelector(`.habit-card[data-id="${id}"] .name-edit-input`);
        if (input) input.focus();
        return;
      }

      const habit = habits.find(h => h.id === id);
      if (!habit) return;

      if (habit.name === newName) {
        // No change — just restore without a toast
        render();
        return;
      }

      habit.name = newName;
      saveHabits(habits);
      render();
      showToast("Habit renamed.");
    }

    // =============================================================
    // ESCAPE HTML
    // This prevents XSS: if someone types "<script>" as a habit
    // name, it won't be executed as code.
    // =============================================================
    function escapeHTML(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // =============================================================
    // TOAST NOTIFICATION
    // Shows a message for 2 seconds then hides it.
    // =============================================================
    let toastTimeout;
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    // =============================================================
    // DISPLAY TODAY'S DATE IN THE HEADER
    // =============================================================
    function setDateDisplay() {
      const el = document.getElementById("date-display");
      const d = new Date();
      // Format: "Saturday, June 1, 2025"
      el.textContent = d.toLocaleDateString(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
      });
    }

    // =============================================================
    // ALLOW PRESSING ENTER IN THE INPUT TO ADD A HABIT
    // =============================================================
    document.getElementById("habit-input").addEventListener("keydown", function (e) {
      if (e.key === "Enter") addHabit();
    });

    // =============================================================
    // STARTUP
    // Run these when the page first loads.
    // =============================================================
    setDateDisplay();
    render(); // render() now calls renderCalendar() internally, so the calendar draws on load too
  </script>

</body>
</html>
